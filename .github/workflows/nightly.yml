name: nightly-pandoc

# A regression watch on pandoc itself: run the same probes against the pandoc
# nightly and report any cell that moved. This has already caught real writer
# changes, in both directions.
#
# What "report" means changed with the delta: the job used to end in
# `git diff --stat results/`, which says a one-line JSON file changed by one
# line and nothing about whether pandoc got better or worse. It now reads both
# sides as verdicts, writes a `format · probe · from -> to` table into the job
# summary, and fails on the thresholds in thresholds.json. The `nightly`
# profile is deliberately looser than the one the repo gates itself with:
# upstream restyles writers routinely, so presentation-class movement is
# expected, and content-class movement is not.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned pandoc
        run: ./scripts/fetch-pandoc.sh
      - name: Fetch pandoc nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The list is not reliably newest-first: on 2026-09-17 and 09-21 its
          # first entry was the 2026-08-16 run, which the provenance check below
          # cannot see (banner and run agree, both are just old). Sort by date
          # here and refuse a build too old to be tonight's.
          read -r run_id created < <(gh run list -R jgm/pandoc --workflow nightly.yml \
                    --status success --limit 20 --json databaseId,createdAt \
                    -q 'sort_by(.createdAt) | last | "\(.databaseId) \(.createdAt)"')
          age=$(( ($(date +%s) - $(date -d "$created" +%s)) / 86400 ))
          if [ "$age" -gt 3 ]; then
            echo "::error::newest successful upstream nightly is run $run_id from $created, $age days old"
            exit 1
          fi
          gh run download "$run_id" -R jgm/pandoc -n nightly-linux -D nightly
          chmod +x nightly/*/pandoc
          echo "NIGHTLY=$(echo nightly/*/pandoc)" >> "$GITHUB_ENV"
          # Which upstream build this is, from the run rather than from the
          # binary's own name. On 2026-09-08 the artifact of a run created that
          # morning contained a build calling itself 3.10.2-nightly-2026-08-16,
          # so the banner alone filed a whole night's measurement three weeks
          # early. run_env.py records these and flags the disagreement.
          meta=$(gh api "repos/jgm/pandoc/actions/runs/$run_id" \
                   --jq '"\(.created_at)\t\(.head_sha)"')
          {
            echo "PANDOC_SOURCE_RUN=$run_id"
            echo "PANDOC_SOURCE_DATE=${meta%%$'\t'*}"
            echo "PANDOC_SOURCE_REF=${meta##*$'\t'}"
            echo "PANDOC_SOURCE_URL=https://github.com/jgm/pandoc/actions/runs/$run_id"
          } >> "$GITHUB_ENV"
      # The committed results are the baseline: they are the pinned release,
      # measured and reviewed. The nightly run overwrites results/ in place.
      - name: Keep the committed results as a baseline
        run: cp -r results results-baseline
      - name: Measure the nightly
        run: PANDOC=$NIGHTLY make lanes
      # No --record here: results/history.jsonl is the repo's own trend line,
      # and a line appended on a runner would only ever live in an artifact.
      # History gets a line when a rerun is committed.
      - name: Report what moved
        run: |
          make delta BASELINE=results-baseline CANDIDATE=results PROFILE=nightly \
            DELTA_ARGS="--markdown delta.md" || echo "BREACH=1" >> "$GITHUB_ENV"
          cat delta.md >> "$GITHUB_STEP_SUMMARY"
      # On 2026-09-08 the watch measured a build calling itself
      # 3.10.2-nightly-2026-08-16, three weeks older than the upstream run it
      # was pulled from - and nothing noticed, because the job never recorded
      # which run it picked. The four runs either side matched their own date
      # exactly, and the artifact of that morning's run holds a 2026-09-08
      # build, so the selection went wrong somewhere that left no trace. The
      # run id is now recorded, and a disagreement is loud rather than silent:
      # a night measured against an unknown build is worse than a night not
      # measured, because the delta reads as authoritative either way.
      - name: Check the build is the one we asked for
        run: |
          python3 - <<'EOF'
          import json, os
          src = json.load(open("results/run.json"))["pandoc"].get("source") or {}
          if not src.get("stale_banner"):
              raise SystemExit(0)
          msg = ("the downloaded build calls itself %s but came from upstream run "
                 "%s, created %s" % (src["names_itself"], src["run"], src["date"]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n> [!WARNING]\n> Provenance mismatch: %s (%s). The "
                       "delta below describes a build whose identity is not "
                       "settled.\n" % (msg, src["url"]))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("MISMATCH=1\n")
          print("::warning::%s" % msg)
          EOF
      - name: Rebuild the dashboard against the nightly
        run: make dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-delta
          path: |
            delta.md
            docs/dashboard.html
            results/delta.json
            results/run.json
      # Failed last, so the summary and the artifact exist to look at. A red
      # nightly with no attached evidence is a red nightly nobody diagnoses.
      - name: Fail on a threshold breach or an unsettled build
        if: env.BREACH == '1' || env.MISMATCH == '1'
        run: |
          if [ "${BREACH:-}" = "1" ]; then
            echo "::error::the nightly moved cells past the thresholds in thresholds.json"
          fi
          if [ "${MISMATCH:-}" = "1" ]; then
            echo "::error::the measured build does not match the upstream run it came from"
          fi
          exit 1
